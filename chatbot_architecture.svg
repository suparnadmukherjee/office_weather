<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img"
     aria-label="Sports chatbot request flow: the Streamlit UI sends a message to handle_turn(), which calls the active LLM provider (Anthropic or OpenAI, chosen by LLM_PROVIDER) and, when the model requests get_weather, hops to the MCP server over Streamable HTTP; each tool_call and tool_result is streamed back to the UI live as it happens, ahead of the final answer.">
  <title>Sports Chatbot — Request &amp; Tool-Call Flow</title>
  <desc>
    Streamlit UI sends user_input+history to handle_turn() in sports_chatbot.py.
    handle_turn() calls the LLM provider selected by the LLM_PROVIDER env var
    (Anthropic claude-opus-5 or OpenAI gpt-4o-mini). When the model wants
    weather data it emits a tool_call for get_weather; handle_turn() executes
    it against the MCP server (office_weather_servers.py) over Streamable
    HTTP and feeds the result back, looping until the model stops calling
    tools. Unlike a plain request/response, each tool_call and tool_result is
    yielded as a progress event and streamed to the UI live, so the user sees
    "Calling get_weather..." before the final answer arrives.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2560c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>

  <text x="520" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">
    Sports Chatbot — Request &amp; Tool-Call Flow
  </text>

  <!-- UI box -->
  <rect x="410" y="50" width="220" height="64" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/>
  <text x="520" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Streamlit UI (browser)</text>
  <text x="520" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555555">streamlit_app.py</text>

  <!-- Core box -->
  <rect x="390" y="250" width="260" height="100" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/>
  <text x="520" y="278" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1a1a1a">handle_turn()</text>
  <text x="520" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555555">sports_chatbot.py</text>
  <text x="520" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555555">async generator — yields progress events</text>
  <text x="520" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#777777">(steps 2 &amp; 5 repeat until the model stops calling tools)</text>

  <!-- LLM Provider box -->
  <rect x="60" y="470" width="340" height="150" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/>
  <text x="230" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">LLM Provider</text>
  <text x="230" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#777777">selected once by LLM_PROVIDER env var</text>
  <line x1="230" y1="520" x2="230" y2="608" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="145" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Anthropic</text>
  <text x="145" y="566" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555555">claude-opus-5</text>
  <text x="145" y="584" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#777777">beta.messages.tool_runner</text>
  <text x="315" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">OpenAI</text>
  <text x="315" y="566" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555555">gpt-4o-mini</text>
  <text x="315" y="584" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#777777">manual tool-call loop</text>

  <!-- MCP box -->
  <rect x="660" y="470" width="340" height="150" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/>
  <text x="830" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">MCP Server</text>
  <text x="830" y="510" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555555">office_weather_servers.py</text>
  <text x="830" y="526" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#777777">Streamable HTTP · 127.0.0.1:8000/mcp</text>
  <line x1="700" y1="540" x2="960" y2="540" stroke="#bbbbbb" stroke-width="1"/>
  <text x="830" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">prompts: guardrails + cricket_expert / badminton_expert</text>
  <text x="830" y="584" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#1a1a1a">tool: get_weather(location)</text>

  <!-- Arrow 1: UI -> Core -->
  <line x1="520" y1="114" x2="520" y2="248" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="182" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">1) user_input, history</text>

  <!-- Arrow 2: Core -> LLM -->
  <line x1="425" y1="350" x2="205" y2="468" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="412" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">2) classify /</text>
  <text x="255" y="426" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">chat turn</text>

  <!-- Arrow 3: LLM -> Core -->
  <line x1="285" y1="468" x2="480" y2="350" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="412" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">3) tool_call:</text>
  <text x="400" y="426" text-anchor="start" font-family="ui-monospace, monospace" font-size="11" fill="#1a1a1a">get_weather(location)</text>

  <!-- Arrow 4: Core -> MCP -->
  <line x1="615" y1="350" x2="815" y2="468" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="398" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">4) call_tool</text>
  <text x="605" y="412" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">(Streamable HTTP)</text>

  <!-- Arrow 5: MCP -> Core -->
  <line x1="875" y1="468" x2="655" y2="350" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="875" y="440" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">5) weather</text>
  <text x="875" y="454" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#1a1a1a">result text</text>

  <!-- Accent stream arrow: Core -> UI, live progress events -->
  <polyline points="390,300 165,300 165,82 405,82" fill="none" stroke="#c2560c" stroke-width="2"
            stroke-dasharray="1,7" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
  <circle cx="165" cy="260" r="3.5" fill="#c2560c"/>
  <circle cx="165" cy="210" r="3.5" fill="#c2560c"/>
  <circle cx="165" cy="160" r="3.5" fill="#c2560c"/>
  <text x="150" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600"
        fill="#c2560c" transform="rotate(-90 150 300)">live: 3) tool_call → 5) tool_result → … → done{persona, text}</text>

  <text x="520" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555555">
    Each tool_call/tool_result (steps 3 &amp; 5) is yielded as its own event and pushed to the Streamlit status line as it happens — the reply no longer appears only at the very end.
  </text>
</svg>
